name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build the Astro site
        env:
          CI: "1"
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Check internal links and JSON-LD validity (built output)
        run: python3 .github/scripts/check-links.py dist

      - name: Editorial automation unit tests (deterministic, no network)
        run: npm test

      - name: Editorial automation dry-run (fixture-driven, no network)
        run: npm run editorial:dry-run

      - name: Check for accidentally committed secrets
        run: |
          if grep -RInE '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-[a-zA-Z0-9]{20,})' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist .; then
            echo "Potential secret found in committed files."
            exit 1
          fi
          echo "No obvious secret patterns found."
