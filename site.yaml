  property: "sc-domain:sublimepantry.com"
  lookbackDays: 90
  workloadIdentity:
    provider: "projects/914157631016/locations/global/workloadIdentityPools/github-actions/providers/sublime-pantry-github"
    serviceAccount: "search-console-reader@project-8035de1c-ed23-4c73-af0.iam.gserviceaccount.com"

